<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bix ai</title>
  <style>
    :root {
      --bg:       #1e1e2e;
      --surface0: #313244;
      --surface1: #45475a;
      --text:     #cdd6f4;
      --subtext:  #a6adc8;
      --yellow:   #f9e2af;
      --blue:     #89b4fa;
      --green:    #a6e3a1;
      --red:      #f38ba8;
      --mauve:    #cba6f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── main column ── */
    .main-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--surface1);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    h1 { font-size: .9rem; font-weight: 600; letter-spacing: .04em; color: var(--mauve); flex-shrink: 0; }

    .mode-group {
      display: flex;
      background: var(--surface0);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      height: 24px;
    }
    .mode-btn {
      flex: 1;
      padding: 0 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--subtext);
      font: inherit;
      font-size: .75rem;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mode-btn.active                    { background: var(--surface1); color: var(--text); }
    .mode-btn.active[data-mode="local"] { color: var(--yellow); }
    .mode-btn.active[data-mode="ai"]    { color: var(--mauve); }

    .api-mode-badge {
      display: none;
      font-size: .72rem;
      color: var(--subtext);
      border: 1px solid var(--surface1);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .api-mode-badge.visible { display: block; }

    .quota-banner {
      background: color-mix(in srgb, var(--yellow) 15%, var(--surface0));
      border: 1px solid var(--yellow);
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85em;
      color: var(--yellow);
    }
    .use-api-btn {
      background: var(--surface1);
      border: 1px solid var(--subtext);
      color: var(--text);
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: .9em;
    }
    .use-api-btn:hover { border-color: var(--text); }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .76rem;
      color: var(--subtext);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--surface1);
      flex-shrink: 0;
      transition: background .2s;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
    .dot.checking    { background: var(--subtext); animation: pulse 1.2s infinite; }
    .dot.summarising { background: var(--yellow);  animation: pulse .8s  infinite; }
    .dot.streaming   { background: var(--blue);    animation: pulse 1s   infinite; }
    .dot.done        { background: var(--green); animation: none; }
    .dot.error       { background: var(--red);   animation: none; }

    #drawer-toggle {
      background: transparent;
      border: none;
      color: var(--subtext);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 6px;
      line-height: 1;
      flex-shrink: 0;
      transition: color .15s, background .15s;
    }
    #drawer-toggle:hover  { color: var(--text); background: var(--surface0); }
    #drawer-toggle.open   { color: var(--text); background: var(--surface1); }

    /* ── messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .msgs-inner {
      width: 100%;
      max-width: 820px;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .msg { display: flex; flex-direction: column; gap: 5px; }
    .msg.user      { align-items: flex-end; }
    .msg.assistant { align-items: flex-start; }
    .role-label {
      font-size: .72rem;
      font-weight: 500;
      color: var(--subtext);
      padding: 0 4px;
    }
    .bubble {
      padding: 11px 16px;
      border-radius: 14px;
      line-height: 1.65;
      max-width: min(70ch, 90%);
      word-break: break-word;
    }
    .msg.user .bubble      { background: var(--mauve); color: var(--bg); border-bottom-right-radius: 3px; }
    .msg.assistant .bubble { background: var(--surface0); border-bottom-left-radius: 3px; }
    .msg.assistant.local .bubble { border-left: 2px solid var(--yellow); }
    .bubble p { margin: 0 0 .55em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: var(--bg);
      border: 1px solid var(--surface1);
      border-radius: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: .85em;
      line-height: 1.5;
    }
    .bubble code { font-family: 'Cascadia Code','Fira Code',monospace; font-size: .88em; }
    .bubble pre code { font-size: inherit; }
    .bubble strong { font-weight: 600; }
    .bubble em { font-style: italic; }
    .meta {
      font-size: .72rem;
      color: var(--subtext);
      padding: 0 4px;
      line-height: 1.6;
    }
    .ollama-tag { color: var(--yellow); }

    /* ── input ── */
    .input-wrap {
      border-top: 1px solid var(--surface1);
      padding: 12px 0 16px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-inner {
      width: 100%;
      max-width: 820px;
      padding: 0 32px;
      display: flex;
      flex-direction: row;
      gap: 8px;
      align-items: flex-end;
    }
    .input-right {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      min-height: 70px;
      max-height: 180px;
      background: var(--surface0);
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      padding: 10px 14px;
      font: inherit;
      font-size: .93rem;
      resize: none;
      outline: none;
      line-height: 1.5;
      transition: border-color .15s;
    }
    textarea:focus { border-color: var(--mauve); }
    textarea::placeholder { color: var(--subtext); }
    #send {
      background: var(--mauve);
      color: var(--bg);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 18px;
      height: 46px;
      width: 100%;
      font: inherit;
      font-weight: 600;
      font-size: .9rem;
      cursor: pointer;
      transition: opacity .15s, background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    #send:hover:not(.is-cancel) { opacity: .85; }
    #send.is-cancel {
      background: transparent;
      color: var(--red);
      border-color: var(--red);
    }

    /* ── drawer ── */
    #drawer {
      width: 0;
      flex-shrink: 0;
      overflow: hidden;
      transition: width .28s ease;
    }
    #drawer.open { width: 40vw; }

    .drawer-inner {
      width: 40vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface0);
      border-left: 1px solid var(--surface1);
    }
    .d-hdr {
      padding: 12px 16px;
      border-bottom: 1px solid var(--surface1);
      font-size: .84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #drawer-close {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: .9rem;
      padding: 3px 6px;
      border-radius: 5px;
      line-height: 1;
      transition: color .15s, background .15s;
    }
    #drawer-close:hover { color: var(--text); background: var(--surface1); }

    .d-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .d-fixed {
      flex-shrink: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .d-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      border-top: 1px solid var(--surface1);
    }
    .d-section { display: flex; flex-direction: column; gap: 9px; }
    .d-title {
      font-size: .69rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--subtext);
    }
    .d-section select {
      background: var(--bg);
      border: 1px solid var(--surface1);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 10px;
      font: inherit;
      font-size: .85rem;
      outline: none;
      width: 100%;
      cursor: pointer;
    }
    .d-section select:focus { border-color: var(--mauve); }

    /* system bars */
    .sys-metric { display: flex; flex-direction: column; gap: 5px; }
    .sys-label-row { display: flex; justify-content: space-between; font-size: .8rem; }
    .sys-label-row .sk { color: var(--subtext); }
    .sys-label-row .sv { color: var(--text); font-variant-numeric: tabular-nums; }
    .bar-wrap { height: 4px; background: var(--surface1); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; background: var(--blue); transition: width .6s ease, background .4s; }
    .bar-fill.warn { background: var(--yellow); }
    .bar-fill.crit { background: var(--red); }

    /* history items */
    .hist-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hi-header {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-size: .78rem;
    }
    .hi-time   { color: var(--subtext); font-variant-numeric: tabular-nums; }
    .hi-model  { color: var(--text); font-weight: 500; }
    .hi-local  { color: var(--yellow); font-size: .72rem; }
    .hi-pro    { color: var(--mauve);  font-size: .72rem; }
    .hi-api    { color: var(--blue);   font-size: .72rem; }
    .hi-err    { color: var(--red);    font-size: .72rem; }

    .hi-summary {
      font-size: .78rem;
      color: var(--text);
      line-height: 1.4;
    }
    .hi-pending { color: var(--subtext); font-style: italic; }
    .hi-src-tag { font-size: .65rem; color: var(--subtext); margin-left: 4px; }
    .hi-error { font-size: .76rem; color: var(--red); padding-top: 5px; border-top: 1px solid var(--surface1); }
    .hi-cancelled { font-size: .76rem; color: var(--subtext); font-style: italic; padding-top: 5px; border-top: 1px solid var(--surface1); }

    /* sub-bubbles (tool use) */
    .sub-bubbles { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; width: 100%; max-width: min(70ch, 90%); }
    .sub-bubble {
      background: var(--bg);
      border: 1px solid var(--surface1);
      border-radius: 8px;
      overflow: hidden;
      font-size: .78rem;
    }
    .sub-bubble-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      cursor: pointer;
      color: var(--subtext);
      user-select: none;
      transition: background .15s;
    }
    .sub-bubble-hdr:hover { background: var(--surface1); }
    .sub-bubble-hdr .chevron { font-size: .6rem; transition: transform .18s; display: inline-block; }
    .sub-bubble.open .chevron { transform: rotate(90deg); }
    .sub-bubble-name { color: var(--yellow); font-weight: 500; }
    .sub-bubble-args { margin-left: 8px; color: var(--subtext); font-size: .7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .sub-bubble-body {
      display: none;
      padding: 8px 12px;
      font-family: 'Cascadia Code','Fira Code',monospace;
      font-size: .78rem;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--subtext);
      border-top: 1px solid var(--surface1);
      max-height: 260px;
      overflow-y: auto;
    }
    .sub-bubble.open .sub-bubble-body { display: block; }
    .hi-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      padding-top: 7px;
      border-top: 1px solid var(--surface1);
    }
    .hi-stat {
      display: flex;
      justify-content: space-between;
      font-size: .74rem;
    }
    .hi-stat .sk { color: var(--subtext); }
    .hi-stat .sv { color: var(--text); font-variant-numeric: tabular-nums; }

    .d-empty { font-size: .8rem; color: var(--surface1); font-style: italic; }

    .d-collapsible {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: color .15s;
    }
    .d-collapsible:hover { color: var(--text); }
    .d-chev { font-size: .6rem; transition: transform .18s; display: inline-block; }

    .mem-hdr {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      padding: 2px 0;
      border-radius: 4px;
      transition: color .15s;
    }
    .mem-hdr:hover { color: var(--text); }

    #history-list { display: flex; flex-direction: column; gap: 10px; }

    .metrics-link {
      display: block;
      font-size: .78rem;
      color: var(--blue);
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--bg);
      text-align: center;
      border: 1px solid var(--surface1);
      transition: opacity .15s;
    }
    .metrics-link:hover { opacity: .75; }

    .gpu-row {
      display: flex;
      justify-content: space-between;
      font-size: .78rem;
      padding: 1px 0;
    }
    .gpu-row .sk { color: var(--subtext); }
    .gpu-row .sv { color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── tool group (grouped tool calls) ── */
    .tool-group { margin-top: 8px; width: 100%; max-width: min(70ch, 90%); }
    .tool-group-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      background: var(--bg);
      border: 1px solid var(--surface1);
      border-radius: 8px;
      cursor: pointer;
      color: var(--subtext);
      font-size: .78rem;
      user-select: none;
      transition: background .15s;
    }
    .tool-group.open .tool-group-hdr { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .tool-group-hdr:hover { background: color-mix(in srgb, var(--surface1) 50%, var(--bg)); }
    .tool-group-hdr .chevron { font-size: .6rem; transition: transform .18s; }
    .tool-group.open .tool-group-hdr .chevron { transform: rotate(90deg); }
    .tool-group-label { flex: 1; color: var(--yellow); font-weight: 500; }
    .tool-group-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: transparent;
      flex-shrink: 0;
      transition: background .3s;
    }
    .tool-group.running .tool-group-dot { background: var(--blue); animation: pulse .8s infinite; }
    .tool-group-body {
      display: none;
      border: 1px solid var(--surface1);
      border-top: none;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      overflow: hidden;
    }
    .tool-group.open .tool-group-body { display: block; }

    /* ── scroll-lock badge ── */
    .messages { position: relative; }
    .scroll-badge {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface1);
      color: var(--text);
      border: 1px solid var(--surface0);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .78rem;
      cursor: pointer;
      display: none;
      z-index: 10;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .scroll-badge.visible { display: block; }
  </style>
</head>
<body>

<div class="main-col">
  <header>
    <h1>bix ai</h1>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-label">idle</span>
    </div>
    <button id="drawer-toggle" title="Stats">≡</button>
  </header>

  <div class="messages" id="messages">
    <div class="msgs-inner" id="msgs-inner"></div>
    <div class="scroll-badge" id="scroll-badge" onclick="jumpToBottom()">↓ new content</div>
  </div>

  <div class="input-wrap">
    <div class="input-inner">
      <textarea id="input" placeholder="Message… (Shift+Enter for new line)" rows="1"></textarea>
      <div class="input-right">
        <div class="mode-group">
          <button class="mode-btn active" data-mode="ai">AI</button>
          <button class="mode-btn" data-mode="local">Local</button>
        </div>
        <div class="api-mode-badge" id="api-mode-badge" title="Using API credits (Pro quota reached)">API</div>
        <button id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="drawer">
  <div class="drawer-inner">
    <div class="d-hdr">
      <span>Stats</span>
      <button id="drawer-close" title="Collapse">✕</button>
    </div>
    <div class="d-body">

      <div class="d-fixed">
        <a class="metrics-link" href="http://192.168.0.47:9000" target="_blank">Internal Metrics →</a>

        <div class="d-section">
          <div class="d-title d-collapsible" onclick="toggleDSection('router')">
            <span class="d-chev" id="router-chev">▶</span>
            AI Router
          </div>
          <div id="router-body" style="display:none">
            <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--surface1)">
              <div style="display:flex;align-items:center;gap:7px">
                <div id="auth-dot" style="width:7px;height:7px;border-radius:50%;background:var(--surface1);flex-shrink:0;transition:background .3s"></div>
                <span id="auth-label" style="font-size:.78rem;color:var(--subtext)">—</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span id="auth-expiry" style="font-size:.72rem;color:var(--subtext);font-variant-numeric:tabular-nums"></span>
                <button onclick="fetchAuthStatus()" title="Refresh auth status" style="background:transparent;border:1px solid var(--surface1);border-radius:4px;color:var(--subtext);font:inherit;font-size:.75rem;padding:1px 7px;cursor:pointer;line-height:1.6;transition:color .15s,border-color .15s" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--subtext)'" onmouseout="this.style.color='var(--subtext)';this.style.borderColor='var(--surface1)'">↺</button>
              </div>
            </div>
            <div id="auth-hint" style="display:none;font-size:.71rem;color:var(--yellow);margin-bottom:8px;line-height:1.6"></div>
            <div class="hi-stats">
              <div class="hi-stat"><span class="sk">Requests</span><span class="sv" id="rs-requests">—</span></div>
              <div class="hi-stat"><span class="sk">Compressed</span><span class="sv ollama-tag" id="rs-summarised">—</span></div>
              <div class="hi-stat"><span class="sk">Checked</span><span class="sv" id="rs-checked">—</span></div>
              <div class="hi-stat"><span class="sk">Prep time</span><span class="sv" id="rs-prep">—</span></div>
            </div>
            <div id="rs-avg-ttft"></div>
          </div>
        </div>

        <div class="d-section">
          <div class="d-title d-collapsible" onclick="toggleDSection('system')">
            <span class="d-chev" id="system-chev">▶</span>
            System
          </div>
          <div id="system-body" style="display:none">
            <div style="display:flex;flex-direction:column;gap:8px">
              <div class="sys-metric">
                <div class="sys-label-row"><span class="sk">CPU</span><span class="sv" id="cpu-val">—</span></div>
                <div class="bar-wrap"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
              </div>
              <div class="sys-metric">
                <div class="sys-label-row"><span class="sk">RAM</span><span class="sv" id="ram-val">—</span></div>
                <div class="bar-wrap"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
              </div>
              <div class="sys-metric" id="vram-metric" style="display:none">
                <div class="sys-label-row"><span class="sk">VRAM</span><span class="sv" id="gpu-vram-val">—</span></div>
                <div class="bar-wrap"><div class="bar-fill" id="vram-bar" style="width:0%"></div></div>
              </div>
            </div>
            <div id="gpu-section" style="margin-top:6px;display:none">
              <div class="gpu-row"><span class="sk">Offload</span><span class="sv" id="gpu-layers-val">—</span></div>
            </div>
          </div>
        </div>

        <div class="d-section">
          <div class="d-title">Model</div>
          <select id="model-select">
            <optgroup label="Claude">
              <option value="claude-opus-4-7">Opus 4.7</option>
              <option value="claude-sonnet-4-6" selected>Sonnet 4.6</option>
              <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
            </optgroup>
            <optgroup label="Ollama (local)">
              <option value="qwen3.5:9b">Qwen 3.5 9B</option>
              <option value="gemma4:e2b">Gemma 4 E2B</option>
              <option value="gemma4:26b">Gemma 4 26B</option>
            </optgroup>
          </select>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
            <span style="font-size:.78rem;color:var(--subtext)" title="Route tool calls to qwen3.5:9b instead of the selected model">Tool offloading</span>
            <button id="tool-offload-btn" style="font-size:.7rem;padding:1px 9px;border-radius:4px;border:1px solid var(--surface1);background:transparent;color:var(--subtext);cursor:pointer;transition:color .15s,border-color .15s,background .15s">off</button>
          </div>
        </div>

        <div class="d-section">
          <div class="d-title d-collapsible" onclick="toggleDSection('curreq')">
            <span class="d-chev" id="curreq-chev">▶</span>
            Current Request
          </div>
          <div id="curreq-body" style="display:none">
            <div id="current-stats"><span class="d-empty">No active request</span></div>
          </div>
        </div>
      </div>

      <div class="d-scroll">

        <div class="d-section" id="mem-section">
          <div class="d-title mem-hdr" id="mem-toggle" onclick="toggleMemList()">
            <span style="display:flex;align-items:center;gap:6px">
              <span class="chevron" id="mem-chevron" style="font-size:.6rem;transition:transform .18s">▶</span>
              Memory
            </span>
            <span id="mem-badge" style="font-weight:400;color:var(--subtext);font-size:.75rem;font-variant-numeric:tabular-nums">—</span>
          </div>
          <div id="mem-list" style="display:none;flex-direction:column;gap:6px;"></div>
        </div>

        <div class="d-section" style="border-top:1px solid var(--surface1);padding-top:12px">
          <div class="d-title" style="display:flex;justify-content:space-between;align-items:baseline">
            <span>History</span>
            <span id="hist-cost-total" style="font-size:.72rem;font-weight:400;color:var(--subtext)"></span>
          </div>
          <div id="history-list"><span class="d-empty">None yet</span></div>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let convHistory  = [];
let mode         = 'ai';
let model        = 'claude-sonnet-4-6';
let busy         = false;
let reqSeq       = 0;
let currentReq   = null;
let reqHistory   = [];
let sysTimer     = null;
let abortCtrl    = null;
let memCount     = 0;
let memEntries   = [];
let memExpanded  = false;
let memLoaded    = false;
let forceApi     = false;   // set to true when Pro quota is exhausted
let lastUserMsg  = '';      // stored for quota retry
let toolOffload  = false;

const modeDefaults = { ai: 'claude-sonnet-4-6', local: 'gemma4:26b' };

// ── DOM ───────────────────────────────────────────────────────────────────────
const msgsEl      = document.getElementById('messages');
const msgsIn      = document.getElementById('msgs-inner');
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('send');
const dotEl       = document.getElementById('dot');
const lblEl       = document.getElementById('status-label');
const drawer      = document.getElementById('drawer');
const toggleBtn   = document.getElementById('drawer-toggle');
const closeBtn    = document.getElementById('drawer-close');
const modelSel    = document.getElementById('model-select');
const curStats    = document.getElementById('current-stats');
const histList    = document.getElementById('history-list');
const scrollBadge = document.getElementById('scroll-badge');

// ── Scroll lock ───────────────────────────────────────────────────────────────
function isAtBottom() { return msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 100; }
function showScrollBadge() { if (scrollBadge) scrollBadge.classList.add('visible'); }
function hideScrollBadge() { if (scrollBadge) scrollBadge.classList.remove('visible'); }
function jumpToBottom() { msgsEl.scrollTop = msgsEl.scrollHeight; hideScrollBadge(); }
function autoScroll()   { if (isAtBottom()) msgsEl.scrollTop = msgsEl.scrollHeight; else showScrollBadge(); }
msgsEl.addEventListener('scroll', () => { if (isAtBottom()) hideScrollBadge(); });

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(stage, label) { dotEl.className = 'dot ' + stage; lblEl.textContent = label; }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtModel(m) { return m.replace(/^claude-/,'').replace(/-\d{8}$/,''); }
function barClass(p) { return p > 85 ? 'bar-fill crit' : p > 70 ? 'bar-fill warn' : 'bar-fill'; }
function friendlyModel(m) {
  if (!m) return 'Assistant';
  const l = m.toLowerCase();
  if (l.startsWith('claude'))  return 'Claude';
  if (l.startsWith('gemma'))   return 'Gemma';
  if (l.startsWith('qwen'))    return 'Qwen';
  if (l.startsWith('llama'))   return 'Llama';
  if (l.startsWith('mistral')) return 'Mistral';
  if (l.startsWith('phi'))     return 'Phi';
  return m.split(':')[0].split('-')[0];
}
function toolFriendlyName(name) {
  const map = {read_file: 'Read File', list_directory: 'List Directory', recall_memories: 'Recall Memories', write_file: 'Write File'};
  return map[name] || name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// Cost per 1M tokens in USD (input, output)
const MODEL_RATES = {
  'claude-opus-4-7':           [15,   75  ],
  'claude-sonnet-4-6':         [3,    15  ],
  'claude-haiku-4-5-20251001': [0.80, 4   ],
};
function estimateCost(model, inTok, outTok) {
  if (!inTok && !outTok) return null;
  const [rIn, rOut] = MODEL_RATES[model] || MODEL_RATES['claude-sonnet-4-6'];
  const usd = ((inTok || 0) * rIn + (outTok || 0) * rOut) / 1e6;
  if (usd < 0.0001) return '<$0.0001';
  return '$' + usd.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
}

// ── Mode ──────────────────────────────────────────────────────────────────────
const localModelValues = new Set(
  [...document.querySelectorAll('#model-select option')].filter(o => o.closest('optgroup')?.label?.includes('local')).map(o => o.value)
);

function setMode(m, syncModel = true) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  if (syncModel) { model = modeDefaults[m] || 'claude-sonnet-4-6'; modelSel.value = model; }
  if (m !== 'ai') { forceApi = false; updateApiModeBadge(); }
}

function updateApiModeBadge() {
  const badge = document.getElementById('api-mode-badge');
  if (badge) badge.classList.toggle('visible', forceApi);
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

modelSel.addEventListener('change', () => {
  model = modelSel.value;
  setMode(localModelValues.has(model) ? 'local' : 'ai', false);
});

const toolOffloadBtn = document.getElementById('tool-offload-btn');
toolOffloadBtn.addEventListener('click', () => {
  toolOffload = !toolOffload;
  toolOffloadBtn.textContent = toolOffload ? 'on' : 'off';
  toolOffloadBtn.style.color       = toolOffload ? 'var(--yellow)' : 'var(--subtext)';
  toolOffloadBtn.style.borderColor = toolOffload ? 'var(--yellow)' : 'var(--surface1)';
  toolOffloadBtn.style.background  = toolOffload ? 'color-mix(in srgb, var(--yellow) 10%, transparent)' : 'transparent';
});

function retryWithApi() {
  if (!lastUserMsg) return;
  forceApi = true;
  updateApiModeBadge();
  // Re-send the last user message via API credits
  const text = lastUserMsg;
  inputEl.value = text;
  send();
}

function _resolvedMode() {
  if (mode === 'local') return 'local';
  if (forceApi)        return 'api';
  return 'pro';
}

// ── Drawer ────────────────────────────────────────────────────────────────────
function openDrawer()  {
  drawer.classList.add('open'); toggleBtn.classList.add('open');
  startSysPoll();
  fetchAuthStatus();
  if (!memLoaded) loadMemory();
}
function closeDrawer() { drawer.classList.remove('open'); toggleBtn.classList.remove('open'); stopSysPoll(); }
toggleBtn.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
closeBtn.addEventListener('click', closeDrawer);

// ── System poll ───────────────────────────────────────────────────────────────
async function fetchSys() {
  try {
    const [d, s] = await Promise.all([
      fetch('/system').then(r => r.json()),
      fetch('/stats').then(r => r.json()).catch(() => null),
    ]);
    if (s) {
      document.getElementById('rs-requests').textContent  = s.requests;
      document.getElementById('rs-summarised').textContent = s.summarised || '0';
      document.getElementById('rs-checked').textContent   = s.checked || '0';
      const prepSec = s.preprocess_ms >= 1000 ? (s.preprocess_ms / 1000).toFixed(1) + 's' : (s.preprocess_ms || 0) + 'ms';
      document.getElementById('rs-prep').textContent = prepSec;
    }
    document.getElementById('cpu-val').textContent = d.cpu_percent + '%';
    const cb = document.getElementById('cpu-bar'); cb.style.width = d.cpu_percent + '%'; cb.className = barClass(d.cpu_percent);
    document.getElementById('ram-val').textContent = `${d.ram_used_gb} / ${d.ram_total_gb} GB`;
    const rb = document.getElementById('ram-bar'); rb.style.width = d.ram_percent + '%'; rb.className = barClass(d.ram_percent);
    const vramMetric = document.getElementById('vram-metric');
    const gpuSection = document.getElementById('gpu-section');
    if (d.gpu) {
      const state = d.gpu.state;
      if (state === 'unreachable' || state === 'idle') {
        if (vramMetric) vramMetric.style.display = 'none';
        if (gpuSection) gpuSection.style.display = 'none';
      } else {
        const vb = document.getElementById('vram-bar');
        const vramGb  = (d.gpu.size_vram  / 1e9).toFixed(1);
        const totalGb = (d.gpu.size_total / 1e9).toFixed(1);
        const vramPct = d.gpu.size_total > 0 ? Math.round(d.gpu.size_vram / d.gpu.size_total * 100) : 0;
        let layersText;
        if (d.gpu.num_gpu != null) {
          layersText = d.gpu.num_gpu > 0 ? d.gpu.num_gpu + ' layers GPU' : 'CPU only';
        } else {
          layersText = d.gpu.size_vram > 0 ? 'Partial GPU' : 'CPU only';
        }
        document.getElementById('gpu-layers-val').textContent = layersText;
        document.getElementById('gpu-vram-val').textContent   = d.gpu.size_vram ? `${vramGb} / ${totalGb} GB` : '—';
        vb.style.width = vramPct + '%'; vb.className = barClass(vramPct);
        if (vramMetric) vramMetric.style.display = '';
        if (gpuSection) gpuSection.style.display = '';
      }
    }
  } catch {}
}
function startSysPoll() { if (sysTimer) return; fetchSys(); sysTimer = setInterval(fetchSys, 2000); }
function stopSysPoll()  { clearInterval(sysTimer); sysTimer = null; }

// ── Markdown ──────────────────────────────────────────────────────────────────
function renderMd(text) {
  let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```(?:\w*)\n([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trimEnd()}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,   '<em>$1</em>');
  s = s.split(/\n{2,}/).map(chunk =>
    chunk.startsWith('<pre') ? chunk : `<p>${chunk.replace(/\n/g,'<br>')}</p>`
  ).join('');
  return s;
}

// ── Bubbles ───────────────────────────────────────────────────────────────────
function addBubble(role, isLocal, modelName) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role + (isLocal ? ' local' : '');
  const lbl = document.createElement('div');
  lbl.className = 'role-label';
  lbl.textContent = role === 'user' ? 'You' : friendlyModel(modelName);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.append(lbl, bubble);
  msgsIn.appendChild(wrap);
  autoScroll();
  return { wrap, bubble };
}

function addMeta(wrap, m) {
  const el = document.createElement('div');
  el.className = 'meta';
  const inTok = m.input_tokens ? `in ${m.input_tokens}` : '';
  const outTok = `out ${m.output_tokens}`;
  const parts = [
    [inTok, outTok].filter(Boolean).join(' · '),
    `TTFT ${m.ttft_ms}ms`,
    `${m.tps} tok/s`,
    `${m.elapsed_ms}ms total`,
  ];
  if (m.preprocess_ms > 50) parts.push(`prep ${m.preprocess_ms}ms`);
  if (m.summarised > 0)     parts.push(`<span class="ollama-tag">${m.summarised} compressed</span>`);
  el.innerHTML = parts.join(' · ');
  wrap.appendChild(el);
}

// ── Drawer stats ──────────────────────────────────────────────────────────────
function row(k, v, live) {
  return `<div class="stat-row"><span class="sk">${k}</span><span class="sv${live?' live':''}">${v}</span></div>`;
}

function renderCurrentStats() {
  if (!currentReq) { curStats.innerHTML = '<span class="d-empty">No active request</span>'; return; }
  const r = currentReq, running = r.status === 'running';
  const statusCol = running ? 'var(--blue)' : r.status === 'error' ? 'var(--red)' : r.status === 'cancelled' ? 'var(--subtext)' : 'var(--green)';
  const live = running ? ' live' : '';
  const cell = (k, v, l) => `<div class="hi-stat"><span class="sk">${k}</span><span class="sv${l?' live':''}">${v}</span></div>`;
  const extras = [
    r.summarised ? cell('Compressed', r.summarised) : '',
    r.skipped    ? cell('Passed',     r.skipped)    : '',
    r.failed     ? cell('Failed',     r.failed)     : '',
  ].filter(Boolean).join('');
  curStats.innerHTML = `
    <div style="font-size:.78rem;margin-bottom:8px;display:flex;align-items:baseline;gap:7px;">
      <span style="color:${statusCol};font-weight:500">${r.status}</span>
      <span style="color:var(--subtext)">${r.mode} · ${friendlyModel(r.model)}</span>
    </div>
    <div class="hi-stats">
      ${cell('In',    r.input_tokens || '—', running)}
      ${cell('Out',   r.output_tokens,        running)}
      ${cell('TTFT',  r.ttft_ms  ? r.ttft_ms  + 'ms' : '—')}
      ${cell('Tok/s', r.tps      || '—',              running)}
      ${cell('Total', r.elapsed_ms ? r.elapsed_ms + 'ms' : '—')}
      ${cell('Prep',  r.preprocess_ms > 50 ? r.preprocess_ms + 'ms' : '—')}
      ${extras}
    </div>`;
}

function renderHistory() {
  const costTotalEl = document.getElementById('hist-cost-total');
  if (!reqHistory.length) {
    histList.innerHTML = '<span class="d-empty">None yet</span>';
    if (costTotalEl) costTotalEl.textContent = '';
    return;
  }

  // Session total cost (Claude requests only)
  const sessionCost = reqHistory
    .filter(r => r.mode !== 'local' && r.status === 'done')
    .reduce((sum, r) => {
      const [rIn, rOut] = MODEL_RATES[r.model] || MODEL_RATES['claude-sonnet-4-6'];
      return sum + ((r.input_tokens || 0) * rIn + (r.output_tokens || 0) * rOut) / 1e6;
    }, 0);
  if (costTotalEl) {
    costTotalEl.textContent = sessionCost > 0
      ? `session $${sessionCost.toFixed(4).replace(/0+$/, '').replace(/\.$/, '')}`
      : '';
  }

  renderAvgTtft();
  histList.innerHTML = [...reqHistory].reverse().slice(0, 12).map(r => {
    const t     = r.timestamp.toTimeString().slice(0,5);
    const local = r.mode === 'local' ? `<span class="hi-local"> · local</span>` : '';
    const pro   = r.mode === 'pro'   ? `<span class="hi-pro"> · pro</span>`     : '';
    const api   = r.mode === 'api'   ? `<span class="hi-api"> · api</span>`     : '';
    const err   = r.status === 'error' ? `<span class="hi-err"> · error</span>` : '';
    const toks  = r.input_tokens ? `${r.input_tokens}→${r.output_tokens}` : `~${r.output_tokens}`;
    const cost  = r.mode !== 'local' ? estimateCost(r.model, r.input_tokens, r.output_tokens) : null;

    let bodyHtml = '';
    if (r.status === 'error') {
      bodyHtml = `<div class="hi-error">${escHtml(r.errorMsg || 'Unknown error')}</div>`;
    } else if (r.status === 'cancelled') {
      bodyHtml = `<div class="hi-cancelled">Cancelled${r.output_tokens ? ` after ${r.output_tokens} tok` : ''}</div>`;
    } else {
      let summaryHtml = '';
      if (r.summary === undefined) {
        summaryHtml = `<div class="hi-summary hi-pending">summarising…</div>`;
      } else if (r.summary) {
        const srcTag = r.summarySource === 'local' ? `<span class="hi-src-tag"> · local</span>` : '';
        summaryHtml = `<div class="hi-summary">${escHtml(r.summary)}${srcTag}</div>`;
      }
      bodyHtml = `${summaryHtml}
      <div class="hi-stats">
        <div class="hi-stat"><span class="sk">Tokens</span><span class="sv">${toks}</span></div>
        ${cost ? `<div class="hi-stat"><span class="sk">Cost</span><span class="sv">${cost}</span></div>` : ''}
        <div class="hi-stat"><span class="sk">TTFT</span><span class="sv">${r.ttft_ms}ms</span></div>
        <div class="hi-stat"><span class="sk">Tok/s</span><span class="sv">${r.tps}</span></div>
        <div class="hi-stat"><span class="sk">Total</span><span class="sv">${r.elapsed_ms}ms</span></div>
        ${r.summarised > 0 ? `<div class="hi-stat"><span class="sk">Compressed</span><span class="sv ollama-tag">${r.summarised} block${r.summarised > 1 ? 's' : ''}</span></div>` : ''}
      </div>`;
    }

    return `<div class="hist-item">
      <div class="hi-header">
        <span class="hi-time">${t}</span>
        <span class="hi-model">${friendlyModel(r.model)}${local}${pro}${api}${err}</span>
      </div>
      ${bodyHtml}
    </div>`;
  }).join('');
}

// ── Memory ────────────────────────────────────────────────────────────────────
async function loadMemory() {
  try {
    const d = await fetch('/memory').then(r => r.json());
    memCount   = d.count;
    memEntries = d.entries || [];
    memLoaded  = true;
    document.getElementById('mem-badge').textContent = memCount || '0';
    if (memExpanded) renderMemList();
  } catch {}
}

function memEntryHtml(m) {
  const date    = (m.date || '').slice(0, 10);
  const title   = escHtml(m.title || '—');
  const summary = escHtml(m.summary || '');
  const tags    = (m.tags || []).map(t => `<span style="font-size:.65rem;color:var(--subtext);background:var(--surface1);border-radius:3px;padding:1px 5px">${escHtml(t)}</span>`).join(' ');
  return `<div class="sub-bubble">
    <div class="sub-bubble-hdr" onclick="this.parentElement.classList.toggle('open')">
      <span class="chevron">▶</span>
      <span style="font-size:.68rem;color:var(--subtext);white-space:nowrap">${date}</span>
      <span style="flex:1;margin-left:6px;color:var(--text);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</span>
    </div>
    <div class="sub-bubble-body">${summary || title}${tags ? '<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">' + tags + '</div>' : ''}</div>
  </div>`;
}

function renderMemList() {
  const list = document.getElementById('mem-list');
  if (!memEntries.length) {
    list.innerHTML = '<span class="d-empty">No memories yet</span>';
    return;
  }
  const show = memEntries.slice(0, 5);
  const more = memEntries.length - show.length;
  list.innerHTML = show.map(memEntryHtml).join('')
    + (more > 0 ? `<div style="font-size:.73rem;color:var(--subtext);text-align:center;cursor:pointer;padding:4px 0" onclick="showAllMemories()">Show ${more} more…</div>` : '');
}

function showAllMemories() {
  document.getElementById('mem-list').innerHTML = memEntries.map(memEntryHtml).join('');
}

async function fetchAuthStatus() {
  const dot    = document.getElementById('auth-dot');
  const label  = document.getElementById('auth-label');
  const expiry = document.getElementById('auth-expiry');
  const hint   = document.getElementById('auth-hint');
  if (!dot) return;
  try {
    const d = await fetch('/auth/status').then(r => r.json());
    hint.style.display = 'none';
    expiry.textContent = '';
    // Billing is always API key — session line shows Claude Code login state
    if (d.claude_code_session) {
      dot.style.background = 'var(--green)';
      label.textContent    = `Claude Code · ${d.subscription_type || 'pro'}`;
      label.style.color    = 'var(--green)';
      if (d.expires_at) {
        const ms = d.expires_at - Date.now();
        const h  = Math.floor(ms / 3_600_000);
        const m  = Math.floor((ms % 3_600_000) / 60_000);
        expiry.textContent = h > 0 ? `${h}h ${m}m` : `${m}m`;
        expiry.title = 'Claude Code session token — time until re-login is required';
        expiry.style.cursor = 'help';
        expiry.style.borderBottom = '1px dotted var(--subtext)';
      }
    } else {
      dot.style.background = 'var(--subtext)';
      label.textContent    = d.has_api_key ? 'API key only' : 'No auth configured';
      label.style.color    = d.has_api_key ? 'var(--subtext)' : 'var(--red)';
    }
  } catch { label.textContent = '—'; }
}

const SECTION_STORE = 'bixai-sections';
function _sectionStates() { try { return JSON.parse(localStorage.getItem(SECTION_STORE) || '{}'); } catch { return {}; } }
function saveSectionState(id, open) { try { const s = _sectionStates(); s[id] = open; localStorage.setItem(SECTION_STORE, JSON.stringify(s)); } catch {} }

function toggleDSection(id) {
  const body = document.getElementById(id + '-body');
  const chev = document.getElementById(id + '-chev');
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  if (chev) chev.style.transform = open ? '' : 'rotate(90deg)';
  saveSectionState(id, !open);
}

function initSectionStates() {
  const saved = _sectionStates();
  ['router', 'system', 'curreq'].forEach(id => {
    const open = saved[id] ?? false;
    const body = document.getElementById(id + '-body');
    const chev = document.getElementById(id + '-chev');
    if (!body) return;
    body.style.display = open ? '' : 'none';
    if (chev) chev.style.transform = open ? 'rotate(90deg)' : '';
  });
}
initSectionStates();

function renderAvgTtft() {
  const el = document.getElementById('rs-avg-ttft');
  if (!el) return;
  const byModel = {};
  for (const r of reqHistory) {
    if (r.status === 'done' && r.ttft_ms > 0 && r.mode !== 'local') {
      if (!byModel[r.model]) byModel[r.model] = {sum: 0, count: 0};
      byModel[r.model].sum += r.ttft_ms;
      byModel[r.model].count++;
    }
  }
  const entries = Object.entries(byModel);
  if (!entries.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="d-title" style="margin-top:6px">Avg TTFT</div>
    <div class="hi-stats" style="padding-top:5px;border-top:none">
      ${entries.map(([m, d]) => `<div class="hi-stat"><span class="sk">${fmtModel(m)}</span><span class="sv">${Math.round(d.sum / d.count)}ms</span></div>`).join('')}
    </div>`;
}

function toggleMemList() {
  memExpanded = !memExpanded;
  const list    = document.getElementById('mem-list');
  const chevron = document.getElementById('mem-chevron');
  list.style.display    = memExpanded ? 'flex' : 'none';
  chevron.style.transform = memExpanded ? 'rotate(90deg)' : '';
  if (memExpanded) {
    if (!memLoaded) loadMemory(); else renderMemList();
  }
}

async function saveMemoryInBackground() {
  if (convHistory.length < 2) return;
  try {
    const res = await fetch('/memory/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        messages:      convHistory,
        model:         model,
        input_tokens:  currentReq?.input_tokens  || 0,
        output_tokens: currentReq?.output_tokens || 0,
      }),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.ok && !data.skipped) {
        memCount++;
        memLoaded = false;
        document.getElementById('mem-badge').textContent = memCount;
        if (memExpanded) loadMemory();
      }
    }
  } catch {}
}

// ── Background summarization ──────────────────────────────────────────────────
async function summarizeInBackground(reqId, userMsg, assistantMsg) {
  const localModel = _resolvedMode() === 'local' ? model : 'gemma4:e2b';
  try {
    const res = await fetch('/summarize', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user_msg: userMsg, assistant_msg: assistantMsg, local_model: localModel }),
    });
    const data = await res.json();
    const entry = reqHistory.find(r => r.id === reqId);
    if (entry) {
      entry.summary = data.summary || null;
      entry.summarySource = data.source;
      renderHistory();
    }
  } catch {
    const entry = reqHistory.find(r => r.id === reqId);
    if (entry) { entry.summary = null; renderHistory(); }
  }
}

// ── Cancel ────────────────────────────────────────────────────────────────────
function setBusy(val) {
  busy = val;
  if (val) {
    sendBtn.textContent = 'Cancel';
    sendBtn.classList.add('is-cancel');
  } else {
    sendBtn.textContent = 'Send';
    sendBtn.classList.remove('is-cancel');
  }
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  inputEl.value = '';
  inputEl.style.height = '';
  setBusy(true);

  lastUserMsg = text;
  const userMsg = text;
  convHistory.push({ role: 'user', content: text });
  addBubble('user', false).bubble.textContent = text;

  const resolvedMode = _resolvedMode();
  const isLocal = resolvedMode === 'local';
  const { wrap, bubble } = addBubble('assistant', isLocal, model);
  let fullText      = '';
  let toolGroupEl   = null;
  let pendingTools  = 0;
  let totalTools    = 0;
  let modelSwap     = null;
  const toolBubbles = {};
  let textSegments    = [{type: 'text', content: ''}];
  let currentTextNode = document.createTextNode('');
  bubble.appendChild(currentTextNode);

  reqSeq++;
  const thisReqId = reqSeq;
  currentReq = {
    id: thisReqId, timestamp: new Date(),
    model, mode: resolvedMode, status: 'running',
    input_tokens: 0, output_tokens: 0,
    ttft_ms: 0, elapsed_ms: 0, tps: 0,
    preprocess_ms: 0, summarised: 0, skipped: 0, failed: 0,
  };
  renderCurrentStats();
  setStatus('checking', 'Checking…');

  abortCtrl = new AbortController();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: convHistory, model, mode: resolvedMode, tool_offload: toolOffload }),
      signal: abortCtrl.signal,
    });

    if (!res.ok) {
      bubble.textContent = `HTTP ${res.status} — check server logs`;
      setStatus('error', 'error');
      currentReq.status = 'error';
      currentReq.errorMsg = `HTTP ${res.status}`;
      reqHistory.push({ ...currentReq, summary: null });
      renderCurrentStats();
      renderHistory();
      setBusy(false);
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const blocks = buf.split('\n\n');
      buf = blocks.pop();

      for (const block of blocks) {
        let evType = null, dataStr = null;
        for (const line of block.split('\n')) {
          if      (line.startsWith('event:')) evType  = line.slice(6).trim();
          else if (line.startsWith('data:'))  dataStr = line.slice(5).trim();
        }
        if (!evType || !dataStr) continue;
        let data;
        try { data = JSON.parse(dataStr); } catch { continue; }

        if (evType === 'model_swap') {
          modelSwap = data;
          setStatus('checking', `↳ ${data.to} (tool-capable)`);

        } else if (evType === 'status') {
          setStatus(data.stage, data.message);

        } else if (evType === 'preprocess') {
          Object.assign(currentReq, {
            preprocess_ms: data.preprocess_ms,
            summarised:    data.summarised,
            skipped:       data.skipped,
            failed:        data.failed,
          });
          renderCurrentStats();

        } else if (evType === 'input_tokens') {
          currentReq.input_tokens = data.count;
          renderCurrentStats();

        } else if (evType === 'delta') {
          fullText += data.text;
          textSegments[textSegments.length - 1].content += data.text;
          currentTextNode.textContent += data.text;
          autoScroll();
          currentReq.output_tokens = Math.round(fullText.length / 4);
          renderCurrentStats();

        } else if (evType === 'metrics') {
          let html = '';
          for (const seg of textSegments) {
            if (seg.type === 'text' && seg.content) html += renderMd(seg.content);
            // tool segments are shown in the tool-group block, not inline
          }
          bubble.innerHTML = html;
          addMeta(wrap, data);
          setStatus('done', `TTFT ${data.ttft_ms}ms · ${data.tps} tok/s`);
          Object.assign(currentReq, {
            status:        'done',
            input_tokens:  data.input_tokens,
            output_tokens: data.output_tokens,
            elapsed_ms:    data.elapsed_ms,
            ttft_ms:       data.ttft_ms,
            preprocess_ms: data.preprocess_ms,
            tps:           data.tps,
            summarised:    data.summarised,
            skipped:       data.skipped  || 0,
            failed:        data.failed   || 0,
          });
          reqHistory.push({ ...currentReq, summary: undefined });
          renderCurrentStats();
          renderHistory();
          // Kick off background summarization
          summarizeInBackground(thisReqId, userMsg, fullText);

        } else if (evType === 'tool_start') {
          const newNode = document.createTextNode('');
          bubble.appendChild(newNode);
          currentTextNode = newNode;
          textSegments.push({type: 'tool', name: toolFriendlyName(data.name)});
          textSegments.push({type: 'text', content: ''});

          pendingTools++;
          totalTools++;
          if (!toolGroupEl) {
            toolGroupEl = document.createElement('div');
            toolGroupEl.className = 'tool-group running';
            const ghdr = document.createElement('div');
            ghdr.className = 'tool-group-hdr';
            const toolModelTag = modelSwap ? ` · ${modelSwap.to}` : '';
            ghdr.innerHTML = `<span class="chevron">▶</span><span class="tool-group-label">⚙ Tool Use${toolModelTag} · 1 call</span><span class="tool-group-dot"></span>`;
            ghdr.addEventListener('click', () => toolGroupEl.classList.toggle('open'));
            const gbod = document.createElement('div');
            gbod.className = 'tool-group-body';
            toolGroupEl.append(ghdr, gbod);
            wrap.appendChild(toolGroupEl);
          } else {
            toolGroupEl.querySelector('.tool-group-label').textContent = `⚙ Tool Use${modelSwap ? ` · ${modelSwap.to}` : ''} · ${totalTools} calls`;
          }

          const sb  = document.createElement('div');  sb.className = 'sub-bubble';
          const hdr = document.createElement('div');  hdr.className = 'sub-bubble-hdr';
          const bod = document.createElement('div');  bod.className = 'sub-bubble-body';
          hdr.innerHTML = `<span class="chevron">▶</span><span class="sub-bubble-name">⚙ ${escHtml(data.name)}</span><span class="sub-bubble-args"></span>`;
          hdr.addEventListener('click', () => sb.classList.toggle('open'));
          sb.append(hdr, bod);
          toolGroupEl.querySelector('.tool-group-body').appendChild(sb);
          toolBubbles[data.index] = { sb, hdr, bod };
          autoScroll();

        } else if (evType === 'tool_input') {
          if (toolBubbles[data.index]) {
            toolBubbles[data.index].bod.textContent += data.partial_json;
          }

        } else if (evType === 'tool_end') {
          const tb = toolBubbles[data.index];
          if (tb) {
            try {
              const parsed = JSON.parse(tb.bod.textContent);
              tb.bod.textContent = JSON.stringify(parsed, null, 2);
              const argsEl = tb.hdr.querySelector('.sub-bubble-args');
              if (argsEl) {
                const entries = Object.entries(parsed);
                if (entries.length > 0) {
                  const [, v] = entries[0];
                  const val = typeof v === 'string' ? v : JSON.stringify(v);
                  argsEl.textContent = val.length > 45 ? '…' + val.slice(-42) : val;
                }
              }
            } catch {}
          }
          pendingTools = Math.max(0, pendingTools - 1);
          if (pendingTools === 0 && toolGroupEl) toolGroupEl.classList.remove('running');

        } else if (evType === 'quota_exceeded') {
          const banner = document.createElement('div');
          banner.className = 'quota-banner';
          banner.innerHTML = `Pro quota reached.
            <button class="use-api-btn" onclick="retryWithApi()">Use API credits</button>
            <span style="margin-left:auto;cursor:default;opacity:.7" title="View billing at console.anthropic.com">↗</span>`;
          wrap.appendChild(banner);
          autoScroll();
          // mark request as quota-exhausted in history
          if (currentReq) {
            currentReq.status   = 'error';
            currentReq.errorMsg = 'Pro quota reached';
            reqHistory.push({ ...currentReq, summary: null });
            renderCurrentStats();
            renderHistory();
          }
          setStatus('', 'quota reached');
          dotEl.className = 'dot';

        } else if (evType === 'done') {
          convHistory.push({ role: 'assistant', content: fullText });
          saveMemoryInBackground();

        } else if (evType === 'error') {
          bubble.textContent = 'Error: ' + data.message;
          setStatus('error', 'error');
          currentReq.status   = 'error';
          currentReq.errorMsg = data.message;
          reqHistory.push({ ...currentReq, summary: null });
          renderCurrentStats();
          renderHistory();
        }
      }
    }

  } catch (e) {
    if (e.name === 'AbortError') {
      if (fullText) {
        bubble.innerHTML = renderMd(fullText) + '<p><em style="opacity:.5">— cancelled</em></p>';
      } else {
        bubble.textContent = '— cancelled';
      }
      setStatus('', 'cancelled');
      dotEl.className = 'dot';
      if (currentReq) {
        currentReq.status = 'cancelled';
        reqHistory.push({ ...currentReq, summary: null });
        renderCurrentStats();
        renderHistory();
      }
    } else {
      bubble.textContent = 'Connection error: ' + e.message;
      setStatus('error', 'error');
      if (currentReq) {
        currentReq.status   = 'error';
        currentReq.errorMsg = e.message;
        reqHistory.push({ ...currentReq, summary: null });
        renderCurrentStats();
        renderHistory();
      }
    }
  }

  abortCtrl = null;
  setBusy(false);
  inputEl.focus();
}

sendBtn.addEventListener('click', () => {
  if (busy && abortCtrl) abortCtrl.abort();
  else send();
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = '';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
});
</script>
